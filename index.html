<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Inkwing</title>
    <!-- Defensive fallback: if Tailwind / globals.css fails to load
         (HMR cache, plugin glitch, etc.) the app would otherwise look
         completely blank. These rules give a baseline dark theme so
         text and layout are at least visible while we debug. They're
         all overridden by Tailwind tokens once globals.css applies. -->
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
