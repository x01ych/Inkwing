[package]
name = "inkwing"
version = "0.1.0"
description = "Inkwing — a Tauri 2 desktop client for sing-box that loads native configs without lossy translation."
authors = ["Inkwing contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "inkwing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = "3"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
tempfile = "3"
notify = "6"
jsonc-parser = { version = "0.32", features = ["cst", "serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
once_cell = "1"
parking_lot = "0.12"
urlencoding = "2"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
